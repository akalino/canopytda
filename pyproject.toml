[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "canopytda"
version = "0.0.1"
description = "Computational tools for finite persistence canopies"
requires-python = ">=3.10"
dependencies = ["gudhi>=3.11"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]